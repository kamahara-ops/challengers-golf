<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- 検索エンジンに載せない（身内アプリのため） -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>夜須Challengers</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B3925">

<!-- iOS ホーム画面アプリ対応 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Challengers">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- favicon -->
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

<style>
  html, body { margin:0; padding:0; height:100%; width:100%; background:#0B3925; overflow:hidden; }
  /* GASアプリ本体を全画面で埋め込む。別オリジン(file/Pages)のiframe内では
     Googleの「ユーザーが作成」バナーは表示されない。 */
  #app {
    position:fixed; inset:0;
    width:100%; height:100%;
    border:0; display:block;
    background:#0B3925;
  }
  /* iframe読込前の背景チラ見え防止 */
  #splash {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0B3925; z-index:1; transition:opacity .4s ease; pointer-events:none;
  }
  #splash img { width:140px; height:140px; opacity:.92; }
  #splash.hide { opacity:0; }
</style>
</head>
<body>

<div id="splash"><img src="./icon-512.png" alt="夜須Challengers"></div>

<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbzxnshtcJRv5h4aMssM7RTXSvp5RfPvxkIvVsDMJLwaWu-vxRcufjyVLU_bTsgEVkU/exec"
  referrerpolicy="no-referrer-when-downgrade"
  allow="clipboard-read; clipboard-write">
</iframe>

<script>
  /* iframe読込完了でスプラッシュを消す */
  (function () {
    var f = document.getElementById('app');
    var sp = document.getElementById('splash');
    function hide(){ if (sp) sp.classList.add('hide'); }
    if (f) f.addEventListener('load', function(){ setTimeout(hide, 250); });
    setTimeout(hide, 6000); // 保険
  })();

  /* Service Worker 登録（インストール可能にするため） */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function(){ /* 失敗してもアプリは動く */ });
    });
  }
</script>
</body>
</html>
